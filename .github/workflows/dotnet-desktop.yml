name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore x64 installer
        run: >
          dotnet restore LenoPwn.Installer/LenoPwn.Installer.wixproj
          -p:Platform=x64
          -p:RuntimeIdentifier=win-x64

      - name: Build x64 installer
        run: >
          dotnet build LenoPwn.Installer/LenoPwn.Installer.wixproj
          --configuration Release
          -p:Platform=x64
          -p:RuntimeIdentifier=win-x64
          -p:SelfContained=true

      - name: Collect MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-ChildItem -Recurse -Filter *.msi | ForEach-Object {
            Copy-Item $_.FullName artifacts/
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LenoPwn-windows-x64
          path: artifacts/*
